name: Tests
on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test native contracts
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test Linux render
        if: runner.os == 'Linux'
        run: xvfb-run -a build/AlphaDecay --render-preview build/preview.png Dy-154
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/AlphaDecay.exe package/
          Copy-Item CREDITS.md package/
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/stage
          cp build/AlphaDecay CREDITS.md package/stage/
          tar -C package/stage -czf package/AlphaDecay-linux.tar.gz AlphaDecay CREDITS.md
          rm -r package/stage
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaDecay-${{ runner.os }}
          path: package/*
          if-no-files-found: error

  verify-package:
    needs: native
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 xvfb
      - uses: actions/download-artifact@v4
        with:
          name: AlphaDecay-${{ runner.os }}
          path: ${{ runner.temp }}/isolated-alpha
      - name: Check isolated Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'isolated-alpha/AlphaDecay.exe'
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check isolated Linux executable
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP/isolated-alpha"
          tar -xzf AlphaDecay-linux.tar.gz
          test -x AlphaDecay
          ./AlphaDecay --self-test
          xvfb-run -a ./AlphaDecay --render-preview preview.png Os-186 1050 700



