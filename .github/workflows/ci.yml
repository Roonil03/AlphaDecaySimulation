name: Tests
on:
  push:
  pull_request:

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone desktop executable
        shell: powershell
        run: .\desktop\build.ps1 -OutputPath .\dist\AlphaDecay.exe
      - name: Run desktop self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\AlphaDecay.exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Desktop self-test failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaDecay-windows
          path: dist/AlphaDecay.exe
          if-no-files-found: error
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable client tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build, test, and start services
        # Image builds run viewer client regressions, Go, Elixir, and locked Rust release tests.
        run: docker compose up --build -d
      - name: Exercise real services
        run: python -m unittest discover -s tests -p 'integration.py' -v
      - name: Reproducible benchmark
        run: |
          python -m observatory
          python -m observatory --validate
          python -m observatory --validate-holdout
      - name: Service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down --volumes


