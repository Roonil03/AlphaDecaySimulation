name: Feature proposal
description: Suggest an improvement or new capability.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What would you like to do, and why is it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the expected behavior and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Research evidence for scientific improvements
      description: For a scientific change, link the research paper and give its DOI, relevant equation, table, or dataset, and units. Explain how it supports the proposal.
